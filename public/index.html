<!DOCTYPE html>

<head>
	<title>Scream for Help - Interactive Fiction</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Spectral:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="/scripts/stylesheet.css">
</head>

<body>

	<div id="title-text"><h1>Scream for Help</h1>
		<h5>Version BETA 2.0.0</h5>
	</div>


	<div class="container" id="container">
			<div id="game">
				<p id="game-text"></p>
			</div>

			<div id="input-text">
				<input id="user-input" placeholder="Type a command or tap a choice..." autocapitalize="off" autocomplete="off" spellcheck="false">
			</div>

			<div id="mobile-controls" aria-label="Quick choices">
				<button type="button" data-choice="a">A</button>
				<button type="button" data-choice="b">B</button>
				<button type="button" data-choice="c">C</button>
				<button type="button" data-choice="y">Y</button>
				<button type="button" data-choice="n">N</button>
				<button type="button" data-choice="hide">Hide</button>
				<button type="button" data-choice="end">End</button>
				<button type="button" data-choice="help">Help</button>
				<button type="button" data-choice="" class="wide">Continue</button>
			</div>
		</div>


	<div id="footer">
		<h6><p>© 2026 by Andrew Sturm</p><p>'Scream for Help' is a work of fiction.<br>Any likeness to actual persons or places is purely coincidental.</p></h6>
	</div>


	<script type="text/javascript" src="scripts/dialogue.js"></script>
    <script type="text/javascript" src="scripts/vars.js"></script>
	<script type="text/javascript" src="scripts/script.js"></script>

</body>

</html>
